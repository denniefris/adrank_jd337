[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "denniefris-adrank_jd337"
version = "0.1.0"
description = "解析时间标记，排列广告召回与排序工程师·MoE 路由的负载不均的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "denniefris" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://denniefris.github.io"
Repository = "https://github.com/denniefris/adrank_jd337"
Issues = "https://github.com/denniefris/adrank_jd337/issues"

[project.scripts]
adrank_jd337 = "adrank_jd337:main"

[tool.setuptools]
py-modules = ["adrank_jd337"]
